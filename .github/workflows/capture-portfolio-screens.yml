name: Capture portfolio screens

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture real deployed pages
        env:
          SITE_BASE: https://at-the-in-gate.slduthie.workers.dev
        run: |
          mkdir -p portfolio-screens
          node <<'NODE'
          const { chromium } = require('playwright');

          const pages = [
            ['home', '/'],
            ['marketplace', '/marketplace'],
            ['community', '/community'],
            ['events', '/events'],
            ['directory', '/directory']
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
              colorScheme: 'light'
            });

            for (const [name, route] of pages) {
              const page = await context.newPage();
              const url = `${process.env.SITE_BASE}${route}`;
              console.log(`Capturing ${url}`);
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(3500);
              await page.screenshot({ path: `portfolio-screens/at-the-in-gate-${name}.png`, fullPage: true });
              await page.close();
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: at-the-in-gate-portfolio-screens
          path: portfolio-screens/*.png
          if-no-files-found: error
          retention-days: 7
