name: Capture portfolio screens

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://zvjgipbfzwouzfxaecro.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_20dxpUalqmZ63WzWmwC7Vw__Eqn_y5J
      APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project and browser
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start the real application
        run: |
          node scripts/ensure-editor-brand-swatches.mjs
          npx next dev --hostname 127.0.0.1 --port 3000 > /tmp/atig-next.log 2>&1 &
          echo $! > /tmp/atig-next.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/atig-next.log
          exit 1
      - name: Capture internal project pages
        run: |
          mkdir -p portfolio-screens
          node <<'NODE'
          const { chromium } = require('playwright');

          const pages = [
            ['home', '/'],
            ['marketplace', '/marketplace'],
            ['community', '/community'],
            ['events', '/events'],
            ['directory', '/directory']
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
              colorScheme: 'light'
            });

            for (const [name, route] of pages) {
              const page = await context.newPage();
              const url = `http://127.0.0.1:3000${route}`;
              console.log(`Capturing ${url}`);
              await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
              await page.waitForTimeout(1500);
              await page.screenshot({ path: `portfolio-screens/at-the-in-gate-${name}.png`, fullPage: true });
              await page.close();
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Show application log on failure
        if: failure()
        run: cat /tmp/atig-next.log || true
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: at-the-in-gate-portfolio-screens
          path: portfolio-screens/*.png
          if-no-files-found: error
          retention-days: 7
